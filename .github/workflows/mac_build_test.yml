name: Mac Build/Test

on:
  # allows us to run workflows manually
  # workflow_dispatch:
  # pull_request:
  #   branches:
  #     - develop
  #   paths-ignore:
  #     - '.github/workflows/docker_publish.yml'
  #     - '.github/workflows/linux_build_test.yml'
  #     - '.github/workflows/linux_upstream_test_*'
  #     - '.github/workflows/windows_build_test.yml'
  #     - '.github/workflows/housekeeping.yml'
  #     - '.github/workflows/changelog_test.yml'
  #     - '.github/actions/**'
  #     - 'CI/**'
  #     - 'doc/**'
  push:
    # branches:
    #   - develop
    # paths-ignore:
    #   - '.github/workflows/docker_publish.yml'
    #   - '.github/workflows/linux_build_test.yml'
    #   - '.github/workflows/linux_upstream_test_*'
    #   - '.github/workflows/windows_build_test.yml'
    #   - '.github/workflows/housekeeping.yml'
    #   - '.github/workflows/changelog_test.yml'
    #   - '.github/actions/**'
    #   - 'CI/**'
    #   - 'doc/**'

  release:
    types: # This configuration does not affect the page_build event above
      - created
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  BuildTest:
    runs-on: macos-latest
    # runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v3

      - name: Initial setup
        shell: bash -l {0}
        run: |
          brew install hdf5
          # Homebrew now ships Eigen 5.x, which is incompatible with MOAB 5.5.1's
          # FindEigen3.cmake (can't parse version) and likely its API usage.
          # Install Eigen 3.4.0 from source instead (header-only, so install is fast).
          # A proper cmake install is needed so that Eigen3Config.cmake is generated
          # for DAGMC's find_package(Eigen3 REQUIRED NO_MODULE).
          curl -sL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.bz2 | tar xj -C /tmp
          cmake -S /tmp/eigen-3.4.0 -B /tmp/eigen-build -DCMAKE_INSTALL_PREFIX=/tmp/eigen
          cmake --install /tmp/eigen-build
          echo "EIGEN_PREFIX=/tmp/eigen" >> $GITHUB_ENV

      - name: Environment Variables
        shell: bash -l {0}
        run: |
          echo "HOME=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV


      - name: Build MOAB
        shell: bash -l {0}
        run: |
          cd ${HOME}
          mkdir -pv moab
          git clone -b 5.5.1 --depth 1 --shallow-submodules https://bitbucket.org/fathomteam/moab moab_src
          # CMake 4.x fixed a typo: TestEndianess.c.in was renamed to TestEndianness.c.in.
          # MOAB v5.5.1 ships a custom config/TestBigEndian.cmake that hardcodes the old
          # misspelled filename, and because config/ is first in CMAKE_MODULE_PATH, it
          # shadows CMake's built-in (working) module.
          # Avoid this by setting HAVE_WORDS_BIGENDIAN=TRUE
          cmake \
              -DCMAKE_INSTALL_PREFIX=${HOME}/moab \
              -DHAVE_WORDS_BIGENDIAN=TRUE \
              -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
              -DEIGEN3_DIR="${EIGEN_PREFIX}/include/eigen3" \
              -DENABLE_HDF5=ON \
              -DENABLE_PYMOAB=OFF \
              -DBUILD_SHARED_LIBS=ON \
              -DENABLE_BLASLAPACK=OFF \
              -DENABLE_FORTRAN=OFF \
              -S moab_src \
              -B build
          cmake -LH build
          cmake --build build --parallel
          cmake --install build
          rm -rf moab_src build lib

      - name: Build DAGMC
        shell: bash -l {0}
        run: |
          cmake \
            -DCMAKE_INSTALL_PREFIX=${HOME}/dagmc \
            -DCMAKE_PREFIX_PATH="${EIGEN_PREFIX};$(brew --prefix)" \
            -DMOAB_DIR=${HOME}/moab \
            -DBUILD_CI_TESTS=ON \
            -DBUILD_STATIC_EXE=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=OFF \
            -DCMAKE_CXX_FLAGS="-Werror=reorder" \
            -S . \
            -B $GITHUB_WORKSPACE/build
          cmake -LH build
          cmake --build build --parallel
          cmake --install build

      - name: Testing DAGMC
        shell: bash -l {0}
        run: |
          cd $GITHUB_WORKSPACE/build
          PATH=$GITHUB_WORKSPACE/build/bin:$PATH make test
