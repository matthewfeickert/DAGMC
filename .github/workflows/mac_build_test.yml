  release:
    types: # This configuration does not affect the page_build event above
      - created
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  BuildTest:
    runs-on: macos-latest
    # runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v3

      - name: Initial setup
        shell: bash -l {0}
        run: |
          brew install eigen hdf5

      - name: Environment Variables
        shell: bash -l {0}
        run: |
          echo "HOME=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV


      - name: Build MOAB
        shell: bash -l {0}
        run: |
          echo "ls $(brew --prefix)/include/*"
          ls -lhtra "$(brew --prefix)/include/*"

          cd ${HOME}
          mkdir -pv moab
          git clone -b 5.5.1 --depth 1 --shallow-submodules https://bitbucket.org/fathomteam/moab moab_src
          # CMake 4.x fixed a typo: TestEndianess.c.in was renamed to TestEndianness.c.in.
          # MOAB v5.5.1 ships a custom config/TestBigEndian.cmake that hardcodes the old
          # misspelled filename, and because config/ is first in CMAKE_MODULE_PATH, it
          # shadows CMake's built-in (working) module.
          # Avoid this by setting HAVE_WORDS_BIGENDIAN=TRUE
          cmake \
              -DCMAKE_INSTALL_PREFIX=${HOME}/moab \
              -DHAVE_WORDS_BIGENDIAN=TRUE \
              -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
              -DENABLE_HDF5=ON \
              -DENABLE_PYMOAB=OFF \
              -DBUILD_SHARED_LIBS=ON \
              -DENABLE_BLASLAPACK=OFF \
              -DENABLE_FORTRAN=OFF \
              -S moab_src \
              -B build
          cmake -LH build
          cmake --build build --parallel
          cmake --install build
          rm -rf moab_src build lib

      - name: Build DAGMC
        shell: bash -l {0}
        run: |
          mkdir -p $GITHUB_WORKSPACE/bld
          cd $GITHUB_WORKSPACE/bld
          cmake ../ -DMOAB_DIR=${HOME}/moab \
                    -DBUILD_CI_TESTS=ON \
                    -DBUILD_STATIC_EXE=OFF \
                    -DBUILD_SHARED_LIBS=ON \
                    -DBUILD_STATIC_LIBS=OFF \
                    -DCMAKE_CXX_FLAGS="-Werror=reorder" \
                    -DCMAKE_INSTALL_PREFIX=${HOME}/dagmc
          make
          make install

      - name: Testing DAGMC
        shell: bash -l {0}
        run: |
          cd $GITHUB_WORKSPACE/bld
          PATH=$GITHUB_WORKSPACE/bld/bin:$PATH make test
